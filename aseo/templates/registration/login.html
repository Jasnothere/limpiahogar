{% extends "aseo/base.html" %}
{% block titulo %}Ingresar{% endblock %}
{% block contenido %}
<div class="card p-4 mx-auto mt-4" style="max-width:420px">
  <h1 class="h4 mb-3">Ingresar</h1>
  <form method="post">{% csrf_token %}
    {% if form.errors %}<div class="alert alert-danger">Usuario o contraseña incorrectos.</div>{% endif %}
    <div class="mb-3"><label class="form-label">Usuario</label><input class="form-control" name="username" autofocus required></div>
    <div class="mb-3"><label class="form-label">Contraseña</label><input class="form-control" type="password" name="password" required></div>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn btn-primary w-100">Ingresar</button>
  </form>
</div>
{% endblock %}
