{% extends "aseo/base.html" %}
{% block titulo %}Eliminar{% endblock %}
{% block contenido %}
<h1 class="h4">Eliminar {{ titulo|lower }}</h1>
<div class="card p-4" style="max-width:640px">
  <p>¿Seguro que quieres eliminar <strong>{{ obj }}</strong>? Esta acción no se puede deshacer.</p>
  <form method="post">{% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn btn-danger">Sí, eliminar</button>
    <a class="btn btn-link" href="{% if next %}{{ next }}{% else %}{% url 'lista' tabla %}{% endif %}">Cancelar</a>
  </form>
</div>
{% endblock %}
