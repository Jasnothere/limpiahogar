# Blueprint de Render: crea la base PostgreSQL y el servicio web gratuitos.
databases:
  - name: limpiahogar-db
    plan: free
    databaseName: limpiahogar
    user: limpiahogar

services:
  - type: web
    name: limpiahogar
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn limpiahogar.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: limpiahogar-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SUPERUSER_USERNAME
        value: profesora
      - key: DJANGO_SUPERUSER_EMAIL
        value: profesora@example.com
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
